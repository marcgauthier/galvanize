[db]
path = "./corrosion.db"
schema_paths = ["/etc/corrosion/schemas"]
# Maximum memory-mapped I/O size in bytes (PRAGMA mmap_size).
# Defaults to 8 GiB (8589934592 bytes). Set to 0 to disable memory-mapped I/O.
# mmap_size_bytes = 8589934592
# Maximum WAL journal file size limit in bytes (PRAGMA journal_size_limit).
# WAL files are truncated to this size upon checkpoint. Defaults to 1 GiB (1073741824 bytes). Set to -1 for unlimited.
# journal_size_limit_bytes = 1073741824
# SQLite page cache size in KiB for writes (PRAGMA cache_size).
# Negative values represent size in KiB; positive values represent number of pages.
# Defaults to -1048576 (-1 GiB).
# cache_size_kib = -1048576

[gossip]
addr = "[::]:8787"
bootstrap = []
plaintext = true
# Optional allow-list to limit cluster peer replication traffic (SWIM, broadcast, sync, datagrams).
# Defaults to ["*"] (allow all). Can specify IPs, subnets (CIDRs), or wildcard "*".
# allow-list = ["10.0.0.1", "10.0.0.2", "192.168.1.0/24"]
# allow-list = ["*"]

[api]
addr = "127.0.0.1:8080"

[admin]
path = "/var/run/corrosion/admin.sock"

[telemetry]
prometheus.addr = "127.0.0.1:9090"

[log]
format = "json"

# Optional one-way Low -> High replication. It is disabled unless explicitly
# enabled. Configure exactly one role, and provide all key material via the
# named environment variables (never in this file).
#
# [highlow]
# enabled = true
#
# [highlow.transport]
# kind = "https"
# endpoint = "https://airgap.example.invalid/inbox"
# bearer-token-env = "GALV_HIGHLOW_TOKEN"
#
# [highlow.low]
# stream-id = "plant-a"
# network-name = "plant-a-network"
# upload-interval-seconds = 60
# recipient-key-id = "high-2026-01"
# recipient-rsa-public-key-env = "GALV_HIGHLOW_HIGH_RSA_PUBLIC_KEY"
# sender-signing-key-env = "GALV_HIGHLOW_LOW_ED25519_KEY"
